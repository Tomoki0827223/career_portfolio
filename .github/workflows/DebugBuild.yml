name: DebugBuild

# 1. トリガーの設定
on:
  push:
    branches:
      - master  # デフォルトブランチがmainの場合は main に書き換えてください
  workflow_dispatch: # 手動実行を可能にする設定

# 2. 環境変数の設定
env:
  # リポジトリのルートディレクトリを基点としたソリューションファイルのパスに書き換えてください
  SOLUTION_FILE_PATH: project/CG2.sln
  CONFIGURATION: Debug

# 3. ジョブの定義
jobs:
  build:
    runs-on: windows-2022 # MSBuildを実行するためWindows環境を指定

    steps:
      # ステップ1: リポジトリのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # ステップ2: MSBuildのパスを通す
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # ステップ3: ビルドの実行
      - name: Build
        run: |
          msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Platform=x64,Configuration=${{ env.CONFIGURATION }}
