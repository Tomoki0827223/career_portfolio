name: DebugBuild

on:
  push:
    branches:
      - camera3  # あなたが今使っているブランチ名
  workflow_dispatch:

env:
  # ファイル構成から判断して、正しいパスに設定しました
  SOLUTION_FILE_PATH: DirectXGame/DirectXGame.sln
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
        run: |
          msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Platform=x64,Configuration=${{ env.CONFIGURATION }}
